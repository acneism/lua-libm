name: Fuzz

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: fuzz (FuzzTrig)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz all seven functions
        env:
          FUZZ_TIME: ${{ github.event_name == 'schedule' && '10m' || '30s' }}
        run: go test . -run '^$' -fuzz '^FuzzTrig$' -fuzztime="$FUZZ_TIME" -parallel=2
